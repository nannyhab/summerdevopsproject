apiVersion: v1
kind: Pod
metadata:
  name: load
  namespace: demo
  labels:
    app: load
spec:
  containers:
    - name: load
      image: curlimages/curl:8.22.0
      command: ["/bin/sh", "-c"]
      args:
        - |
          while true; do
            ( code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 3 http://web/api)
              echo "$(date -u +%H:%M:%S) $code" ) &
            sleep 0.5
          done
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          memory: 64Mi
